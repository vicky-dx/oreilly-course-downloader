<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'Reilly Offline Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #09090b;
      --panel-bg: #121216;
      --card-bg: #18181c;
      --card-hover-bg: #222329;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-color: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-color: #ef4444;
      --accent-hover: #dc2626;
      --secondary-color: #3b82f6;
      --success-color: #22c55e;
      --kbd-bg: #27272a;
      --shadow-color: rgba(0, 0, 0, 0.4);
      --drawer-shadow: -8px 0 24px rgba(0, 0, 0, 0.5);
      --focus-ring: rgba(239, 68, 68, 0.4);
    }

    [data-theme="light"] {
      --bg-color: #f4f4f5;
      --panel-bg: #ffffff;
      --card-bg: #fafafa;
      --card-hover-bg: #f4f4f5;
      --border-color: rgba(0, 0, 0, 0.08);
      --text-color: #09090b;
      --text-muted: #71717a;
      --accent-color: #ef4444;
      --accent-hover: #dc2626;
      --secondary-color: #2563eb;
      --success-color: #16a34a;
      --kbd-bg: #e4e4e7;
      --shadow-color: rgba(0, 0, 0, 0.05);
      --drawer-shadow: -8px 0 24px rgba(0, 0, 0, 0.1);
      --focus-ring: rgba(239, 68, 68, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      line-height: 1.5;
      transition: background-color 0.2s, color 0.2s;
    }

    .app-layout {
      display: flex;
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Left Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
      z-index: 10;
    }

    .sidebar-brand {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
      height: 70px;
    }

    .brand-emoji {
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-text {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .sidebar-nav {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: all 0.15s;
    }

    .nav-item svg {
      flex-shrink: 0;
      opacity: 0.85;
      transition: stroke 0.15s;
    }

    .nav-item:hover {
      color: var(--text-color);
      background-color: var(--card-hover-bg);
    }

    .nav-item:hover svg {
      stroke: var(--text-color);
    }

    .nav-item.active {
      color: #ffffff;
      background-color: var(--accent-color);
    }

    .nav-item.active svg {
      stroke: #ffffff;
      opacity: 1;
    }

    .sidebar-section {
      flex-grow: 1;
      padding: 12px;
      overflow-y: auto;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 0 16px 4px 16px;
    }

    .categories-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .category-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      width: 100%;
    }

    .category-btn:hover {
      color: var(--text-color);
      background-color: var(--card-hover-bg);
    }

    .category-btn.active {
      color: var(--accent-color);
      font-weight: 600;
      background-color: rgba(239, 68, 68, 0.08);
    }

    .category-count {
      font-size: 0.72rem;
      background-color: var(--border-color);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    .footer-btn {
      flex: 1;
      height: 36px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all 0.15s;
    }

    .footer-btn svg {
      opacity: 0.8;
      transition: stroke 0.15s, fill 0.15s;
    }

    .footer-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
      background-color: var(--card-hover-bg);
    }

    .footer-btn:hover svg {
      stroke: var(--accent-color);
    }

    /* Main Content Area */
    .main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    /* Top Command Bar */
    .command-bar {
      height: 70px;
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      flex-shrink: 0;
    }

    .search-container {
      position: relative;
      width: 440px;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-input {
      width: 100%;
      height: 38px;
      padding: 0 44px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px var(--focus-ring);
    }

    .search-kbd {
      position: absolute;
      right: 14px;
      background-color: var(--kbd-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      pointer-events: none;
    }

    .sort-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sort-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sort-select {
      height: 36px;
      padding: 0 16px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 8px;
      outline: none;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .sort-select:focus {
      border-color: var(--accent-color);
    }

    /* Workspace Panel */
    .workspace-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
    }

    /* Home View Styling */
    .home-view {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .greeting-section {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.08) 0%, transparent 80%);
      border: 1px solid var(--border-color);
      padding: 24px 32px;
      border-radius: 14px;
    }

    .greeting-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .greeting-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .home-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .shelf-container {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .shelf-container::-webkit-scrollbar {
      height: 6px;
    }

    .shelf-container::-webkit-scrollbar-thumb {
      background-color: var(--border-color);
      border-radius: 4px;
    }

    .shelf-card {
      width: 170px;
      flex-shrink: 0;
    }

    /* Grid View Styling */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 24px;
      margin-bottom: 20px;
    }

    /* Book Card */
    .book-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .book-card:focus-visible,
    .book-card.selected {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
      transform: translateY(-4px);
      box-shadow: 0 8px 24px var(--shadow-color);
    }

    .book-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
      box-shadow: 0 8px 24px var(--shadow-color);
    }

    .cover-container {
      width: 100%;
      aspect-ratio: 3/4;
      background-color: rgba(0, 0, 0, 0.15);
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border-color);
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .book-card:hover .cover-img {
      transform: scale(1.04);
    }

    .cover-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      text-align: center;
      background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
      color: var(--text-muted);
    }

    .cover-fallback-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cover-fallback-badge {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-color);
      font-weight: 700;
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 4px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-color);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 2.3rem;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-progress-bar {
      height: 3px;
      background-color: var(--border-color);
      width: 100%;
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .card-progress-fill {
      height: 100%;
      background-color: var(--success-color);
      width: 0%;
    }

    .bookmark-indicator {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(4px);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-color);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      z-index: 5;
    }

    .bookmark-indicator svg {
      display: block;
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
      width: 100%;
      grid-column: 1 / -1;
    }

    .empty-state h3 {
      color: var(--text-color);
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      margin-bottom: 6px;
    }

    /* Shimmer Skeleton Cards */
    .skeleton-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      height: 260px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .skeleton-cover {
      height: 65%;
      background: linear-gradient(90deg, var(--card-bg) 25%, var(--border-color) 50%, var(--card-bg) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
    }

    .skeleton-text {
      flex-grow: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .skeleton-line {
      height: 10px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--card-bg) 25%, var(--border-color) 50%, var(--card-bg) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
    }

    .skeleton-line.short {
      width: 60%;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Load more panel */
    .load-more-trigger {
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 20px;
      grid-column: 1 / -1;
    }

    .spinner {
      border: 2px solid var(--border-color);
      border-top: 2px solid var(--accent-color);
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Right Inspector Drawer */
    .inspector-drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: 440px;
      height: 100%;
      background-color: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      box-shadow: var(--drawer-shadow);
      z-index: 100;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .inspector-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      height: 70px;
    }

    .drawer-header-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .drawer-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.35rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .drawer-close-btn:hover {
      color: var(--text-color);
    }

    .drawer-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .drawer-book-hero {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .drawer-cover-wrapper {
      width: 100px;
      aspect-ratio: 3/4;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
      background-color: rgba(0, 0, 0, 0.15);
    }

    .drawer-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .drawer-hero-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .drawer-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-color);
    }

    .drawer-author {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .drawer-badge {
      display: inline-block;
      align-self: flex-start;
      padding: 2px 8px;
      background-color: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.15);
      color: var(--accent-color);
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .drawer-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .drawer-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .drawer-description {
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--text-color);
      max-height: 150px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .drawer-metadata-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      font-size: 0.8rem;
    }

    .metadata-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .metadata-label {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .metadata-value {
      color: var(--text-color);
    }

    /* Tags Editor Panel */
    .drawer-tags-editor {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .drawer-tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--text-color);
      font-weight: 500;
    }

    .tag-remove-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      transition: all 0.15s;
    }

    .tag-remove-btn:hover {
      background-color: var(--accent-color);
      color: #ffffff;
    }

    .drawer-tag-input-wrapper {
      display: flex;
      gap: 8px;
    }

    .tag-input {
      flex-grow: 1;
      height: 32px;
      padding: 0 10px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .tag-input:focus {
      border-color: var(--accent-color);
    }

    .tag-add-btn {
      width: 32px;
      height: 32px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .tag-add-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .drawer-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .drawer-primary-btn {
      height: 40px;
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background-color 0.15s;
    }

    .drawer-primary-btn:hover {
      background-color: var(--accent-hover);
    }

    .drawer-secondary-buttons {
      display: flex;
      gap: 8px;
    }

    .drawer-secondary-btn {
      flex: 1;
      height: 36px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .drawer-secondary-btn svg {
      opacity: 0.8;
      transition: stroke 0.15s, fill 0.15s;
    }

    .drawer-secondary-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .drawer-secondary-btn:hover svg {
      stroke: var(--accent-color);
    }

    .drawer-progress-slider-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }

    .progress-slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
    }

    .progress-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--border-color);
      outline: none;
      cursor: pointer;
    }

    .progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--success-color);
      cursor: pointer;
    }

    .related-books-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .related-item-card {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 6px;
      border-radius: 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .related-item-card:hover {
      border-color: var(--accent-color);
    }

    .related-cover {
      width: 36px;
      aspect-ratio: 3/4;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
      background-color: rgba(0, 0, 0, 0.1);
    }

    .related-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .related-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .related-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .related-author {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bottom Status Bar */
    .status-bar {
      height: 28px;
      background-color: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 0.74rem;
      color: var(--text-muted);
      flex-shrink: 0;
      z-index: 10;
    }

    .status-left {
      display: flex;
      gap: 16px;
    }

    .status-center {
      font-weight: 500;
      color: var(--text-color);
    }

    /* Keyboard Shortcuts Help Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .help-modal-content {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      width: 400px;
      max-width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .help-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .help-close-btn:hover {
      color: var(--text-color);
    }

    .help-modal-content h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      margin-bottom: 18px;
      color: var(--text-color);
    }

    .help-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .help-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);

    .help-row kbd {

      color: var(--text-color);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.75rem;
    }

    .help-row span {
      margin-left: auto;
    }
  </style>
</head>

    <!-- Main Content -->

    <!-- Right Inspector Drawer -->

  <!-- Keyboard Shortcuts Helper Overlay -->
  <div id="help-modal" class="modal-overlay" onclick="if(event.target.id === 'help-modal') toggleHelpModal(false)">
    <div class="help-modal-content">
      <button class="help-close-btn" onclick="toggleHelpModal(false)">&times;</button>
      <h2>
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:inline-block; vertical-align:middle; margin-right:4px;"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6.01" y2="8"></line><line x1="10" y1="8" x2="10.01" y2="8"></line><line x1="14" y1="8" x2="14.01" y2="8"></line><line x1="18" y1="8" x2="18.01" y2="8"></line><line x1="6" y1="12" x2="6.01" y2="12"></line><line x1="18" y1="12" x2="18.01" y2="12"></line><line x1="7" y1="16" x2="17" y2="16"></line><line x1="10" y1="12" x2="14" y2="12"></line></svg>
        Keyboard Shortcuts
      </h2>
      <div class="help-grid">
        <div class="help-row"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> <span>Navigate book cards</span></div>
        <div class="help-row"><kbd>Space</kbd> <span>Toggle Inspector Drawer</span></div>
        <div class="help-row"><kbd>Enter</kbd> <span>Open selected book reader</span></div>
        <div class="help-row"><kbd>/</kbd> or <kbd>Ctrl</kbd>+<kbd>K</kbd> <span>Focus Search</span></div>
        <div class="help-row"><kbd>Esc</kbd> <span>Close active Drawer or Modal</span></div>
        <div class="help-row"><kbd>?</kbd> <span>Toggle this shortcuts guide</span></div>
      </div>
    </div>
  </div>

  <script>
    // --- 1. Storage Wrapper Class ---
    class LibraryStorage {
      static get KEY() { return 'library-data-v1'; }

      static async save(readingMap, preferences) {
        try {
          const readingArray = Array.from(readingMap.entries());
          const payload = {
            version: 1,
            preferences,
            reading: readingArray
          };
          localStorage.setItem(this.KEY, JSON.stringify(payload));
          
          await fetch('/api/library_state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } catch (e) {
          console.error("Storage save failed:", e);
        }
      }
    }

    // --- 2. Search Indexer ---
    class SearchIndexer {
      static normalize(str) {
        if (!str) return "";
        return str
          .normalize("NFKD")
          .replace(/[̀-ͯ]/g, "") // remove diacritics
          .toLowerCase()
          .replace(/[^\w\s-]/g, "")        // strip punctuation
          .replace(/\s+/g, " ")            // collapse whitespace
          .trim();
      }

      static build(books, searchMap) {
        searchMap.clear();
        books.forEach(b => {
          const parts = [
            b.title || "",
            b.author || "",
            b.publisher || "",
            b.description || "",
            (b.categories || []).join(" ")
          ];
          const blob = parts.map(p => this.normalize(p)).join(" ");
          searchMap.set(b.folder, blob);
        });
      }
    }

    // --- 3. Library Store ---
    class LibraryStore {
      constructor() {
        this.state = {
          books: [],
          readingStates: new Map(),
          preferences: {
            theme: 'dark',
            sort: 'title',
            lastView: 'home'
          },
          ui: {
            currentView: 'home',
            activeCategory: null,
            selectedIndex: null,
            searchQuery: '',
            pagination: {
              visibleCount: 24,
              loading: false,
              hasMore: true
            },
            drawer: {
              open: false,
              selectedFolder: null
            }
          }
        };

        this.subscribers = [];
        this.searchMap = new Map();
      }

      subscribe(cb) {
        this.subscribers.push(cb);
        return () => {
          this.subscribers = this.subscribers.filter(s => s !== cb);
        };
      }

      notify() {
        this.subscribers.forEach(cb => cb(this.state));
      }

      // Derived State Getters
      get filteredBooks() {
        let result = [...this.state.books];
        const view = this.state.ui.currentView;

        // 1. Filter by view
        if (view === 'reading') {
          result = result.filter(b => {
            const rs = this.state.readingStates.get(b.folder);
            return rs && rs.progress > 0 && rs.progress < 100;
          });
        } else if (view === 'bookmarks') {
          result = result.filter(b => {
            const rs = this.state.readingStates.get(b.folder);
            return rs && rs.bookmarked;
          });
        } else if (view === 'category') {
          const cat = this.state.ui.activeCategory;
          if (cat) {
            result = result.filter(b => b.categories.includes(cat));
          }
        }

        // 2. Filter by search
        const query = this.state.ui.searchQuery;
        if (query) {
          result = result.filter(b => {
            const blob = this.searchMap.get(b.folder);
            return blob && blob.includes(query);
          });
        }

        // 3. Sort
        const sort = this.state.preferences.sort;
        result.sort((a, b) => {
          if (sort === 'title') {
            return a.title.localeCompare(b.title);
          } else if (sort === 'year') {
            const ya = a.year || '0';
            const yb = b.year || '0';
            if (yb !== ya) return yb.localeCompare(ya);
            return a.title.localeCompare(b.title);
          } else if (sort === 'lastOpened') {
            const ra = this.state.readingStates.get(a.folder);
            const rb = this.state.readingStates.get(b.folder);
            const ta = ra ? ra.lastOpened : 0;
            const tb = rb ? rb.lastOpened : 0;
            if (tb !== ta) return tb - ta;
            return a.title.localeCompare(b.title);
          } else if (sort === 'progress') {
            const ra = this.state.readingStates.get(a.folder);
            const rb = this.state.readingStates.get(b.folder);
            const pa = ra ? ra.progress : 0;
            const pb = rb ? rb.progress : 0;
            if (pb !== pa) return pb - pa;
            return a.title.localeCompare(b.title);
          } else if (sort === 'author') {
            const aa = a.author || '';
            const ab = b.author || '';
            return aa.localeCompare(ab);
          } else if (sort === 'publisher') {
            const pa = a.publisher || '';
            const pb = b.publisher || '';
            return pa.localeCompare(pb);
          }
          return 0;
        });

        return result;
      }

      get visibleBooks() {
        return this.filteredBooks.slice(0, this.state.ui.pagination.visibleCount);
      }

      get categoryCounts() {
        const counts = new Map();
        this.state.books.forEach(b => {
          (b.categories || []).forEach(cat => {
            counts.set(cat, (counts.get(cat) || 0) + 1);
          });
        });
        return Array.from(counts.entries()).sort((a, b) => b[1] - a[1]);
      }

      get recentlyOpened() {
        return this.state.books
          .filter(b => {
            const rs = this.state.readingStates.get(b.folder);
            return rs && rs.lastOpened > 0;
          })
          .sort((a, b) => {
            const ra = this.state.readingStates.get(a.folder);
            const rb = this.state.readingStates.get(b.folder);
            return rb.lastOpened - ra.lastOpened;
          });
      }

      get recentlyPublished() {
        return [...this.state.books].sort((a, b) => {
          const da = a.date || a.year || '';
          const db = b.date || b.year || '';
          return db.localeCompare(da);
        });
      }

      initialize(serverState, rawBooks) {
        if (serverState) {
          if (serverState.preferences) {
            this.state.preferences = { ...this.state.preferences, ...serverState.preferences };
            this.state.ui.currentView = this.state.preferences.lastView || 'home';
          }
          if (serverState.reading) {
            this.state.readingStates = new Map(serverState.reading);
          }
        }

        const books = rawBooks.map(b => {
          const author = b.author && !['unknown', 'unknown author', 'n/a', '-', ''].includes(b.author.trim().toLowerCase()) 
            ? b.author.trim() 
            : null;
          const publisher = b.publisher && !['unknown', 'n/a', '-', ''].includes(b.publisher.trim().toLowerCase()) 
            ? b.publisher.trim() 
            : null;
          
          const defaultCategories = b.category && b.category !== 'Unknown' 
            ? b.category.split(/[,;|]/).map(c => c.trim()).filter(Boolean)
            : [];

          const rs = this.state.readingStates.get(b.folder);
          const categories = rs && rs.categories ? rs.categories : defaultCategories;

          return {
            ...b,
            author,
            publisher,
            defaultCategories,
            categories
          };
        });

        this.state.books = books;
        SearchIndexer.build(this.state.books, this.searchMap);
        this.state.ui.pagination.hasMore = this.state.ui.pagination.visibleCount < this.filteredBooks.length;

        document.getElementById('sort-select').value = this.state.preferences.sort;
        this.notify();
      }

      dispatch(action) {
        let changed = false;
        let saveState = false;

        switch (action.type) {
          case 'SET_BOOKS':
            this.state.books = action.payload.books;
            SearchIndexer.build(this.state.books, this.searchMap);
            this.state.ui.pagination.hasMore = this.state.ui.pagination.visibleCount < this.filteredBooks.length;
            changed = true;
            break;

          case 'SET_SEARCH': {
            const norm = SearchIndexer.normalize(action.payload.query);
            if (this.state.ui.searchQuery !== norm) {
              this.state.ui.searchQuery = norm;
              this.state.ui.pagination.visibleCount = 24;
              this.state.ui.pagination.hasMore = this.state.ui.pagination.visibleCount < this.filteredBooks.length;
              this.state.ui.selectedIndex = this.filteredBooks.length > 0 ? 0 : null;
              changed = true;
            }
            break;
          }

          case 'SET_VIEW': {
            const { view, category } = action.payload;
            if (this.state.ui.currentView !== view || this.state.ui.activeCategory !== category) {
              this.state.ui.currentView = view;
              this.state.ui.activeCategory = category;
              this.state.ui.pagination.visibleCount = 24;
              this.state.ui.pagination.hasMore = this.state.ui.pagination.visibleCount < this.filteredBooks.length;
              this.state.ui.selectedIndex = this.filteredBooks.length > 0 ? 0 : null;
              this.state.preferences.lastView = view;
              changed = true;
              saveState = true;
            }
            break;
          }

          case 'TOGGLE_BOOKMARK': {
            const folder = action.payload.folder;
            let rs = this.state.readingStates.get(folder);
            if (!rs) {
              rs = { progress: 0, bookmarked: false, completed: false, lastOpened: 0 };
            }
            rs.bookmarked = !rs.bookmarked;
            this.state.readingStates.set(folder, { ...rs });
            changed = true;
            saveState = true;
            break;
          }

          case 'UPDATE_PROGRESS': {
            const { folder, progress } = action.payload;
            let rs = this.state.readingStates.get(folder);
            if (!rs) {
              rs = { progress: 0, bookmarked: false, completed: false, lastOpened: 0 };
            }
            rs.progress = progress;
            rs.completed = progress === 100;
            rs.lastOpened = Date.now();
            this.state.readingStates.set(folder, { ...rs });
            changed = true;
            saveState = true;
            break;
          }

          case 'UPDATE_BOOK_CATEGORIES': {
            const { folder, categories } = action.payload;
            let rs = this.state.readingStates.get(folder);
            if (!rs) {
              rs = { progress: 0, bookmarked: false, completed: false, lastOpened: 0 };
            }
            rs.categories = categories;
            this.state.readingStates.set(folder, { ...rs });

            const book = this.state.books.find(b => b.folder === folder);
            if (book) {
              book.categories = categories;
            }

            SearchIndexer.build(this.state.books, this.searchMap);

            changed = true;
            saveState = true;
            break;
          }

          case 'SELECT_BOOK':
            if (this.state.ui.drawer.selectedFolder !== action.payload.folder || this.state.ui.selectedIndex !== action.payload.index) {
              this.state.ui.drawer.selectedFolder = action.payload.folder;
              this.state.ui.selectedIndex = action.payload.index;
              changed = true;
            }
            break;

          case 'SET_THEME':
            if (this.state.preferences.theme !== action.payload.theme) {
              this.state.preferences.theme = action.payload.theme;
              changed = true;
              saveState = true;
            }
            break;

          case 'SET_SORT':
            if (this.state.preferences.sort !== action.payload.sort) {
              this.state.preferences.sort = action.payload.sort;
              this.state.ui.pagination.visibleCount = 24;
              this.state.ui.pagination.hasMore = this.state.ui.pagination.visibleCount < this.filteredBooks.length;
              this.state.ui.selectedIndex = this.filteredBooks.length > 0 ? 0 : null;
              changed = true;
              saveState = true;
            }
            break;

          case 'LOAD_MORE':
            if (this.state.ui.pagination.hasMore && !this.state.ui.pagination.loading) {
              this.state.ui.pagination.loading = true;
              const amount = action.payload.amount || 24;
              const nextCount = this.state.ui.pagination.visibleCount + amount;
              this.state.ui.pagination.visibleCount = Math.min(nextCount, this.filteredBooks.length);
              this.state.ui.pagination.hasMore = this.state.ui.pagination.visibleCount < this.filteredBooks.length;
              this.state.ui.pagination.loading = false;
              changed = true;
            }
            break;

          case 'SET_DRAWER':
            if (this.state.ui.drawer.open !== action.payload.open || this.state.ui.drawer.selectedFolder !== action.payload.folder) {
              this.state.ui.drawer.open = action.payload.open;
              this.state.ui.drawer.selectedFolder = action.payload.folder;
              changed = true;
            }
            break;
        }

        if (saveState) {
          LibraryStorage.save(this.state.readingStates, this.state.preferences);
        }
        if (changed) {
          this.notify();
        }
      }
    }

    // Global Store Instance
    const store = new LibraryStore();

    // --- 4. Event handlers and listeners ---
    let searchDebounceTimer = null;
    document.getElementById('global-search').addEventListener('input', (e) => {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        store.dispatch({ type: 'SET_SEARCH', payload: { query: e.target.value } });
      }, 150);
    });

    function toggleTheme() {
      const current = store.state.preferences.theme;
      const theme = current === 'light' ? 'dark' : 'light';
      store.dispatch({ type: 'SET_THEME', payload: { theme } });
    }

    function toggleHelpModal(open) {
      document.getElementById('help-modal').classList.toggle('open', open);
    }

    // Custom tag updates
    function addCustomTag(folder) {
      const input = document.getElementById('add-tag-input');
      if (!input) return;
      const tag = input.value.trim();
      if (!tag) return;

      const book = store.state.books.find(b => b.folder === folder);
      if (!book) return;

      const currentCats = [...book.categories];
      if (!currentCats.includes(tag)) {
        currentCats.push(tag);
        store.dispatch({
          type: 'UPDATE_BOOK_CATEGORIES',
          payload: { folder, categories: currentCats }
        });
      }
      input.value = "";
    }

    function removeCustomTag(folder, cat) {
      const book = store.state.books.find(b => b.folder === folder);
      if (!book) return;

      const currentCats = book.categories.filter(c => c !== cat);
      store.dispatch({
        type: 'UPDATE_BOOK_CATEGORIES',
        payload: { folder, categories: currentCats }
      });
    }

    // --- 5. UI Render Components ---

    // Dynamic Category List inside Left Sidebar
    function renderSidebarCategories(state) {
      const el = document.getElementById('sidebar-categories');
      const counts = store.categoryCounts;
      const activeCat = state.ui.activeCategory;
      const view = state.ui.currentView;

      const fragment = document.createDocumentFragment();
      counts.slice(0, 15).forEach(([cat, count]) => {
        const btn = document.createElement('button');
        btn.className = `category-btn ${view === 'category' && activeCat === cat ? 'active' : ''}`;
        btn.onclick = () => store.dispatch({ type: 'SET_VIEW', payload: { view: 'category', category: cat } });

        const name = document.createElement('span');
        name.textContent = cat;
        btn.appendChild(name);

        const countBadge = document.createElement('span');
        countBadge.className = 'category-count';
        countBadge.textContent = count;
        btn.appendChild(countBadge);

        fragment.appendChild(btn);
      });

      el.innerHTML = "";
      el.appendChild(fragment);
    }

    // Sidebar active item classes
    function renderSidebarNavigation(state) {
      const view = state.ui.currentView;
      document.getElementById('nav-home').classList.toggle('active', view === 'home');
      document.getElementById('nav-all').classList.toggle('active', view === 'all');
      document.getElementById('nav-reading').classList.toggle('active', view === 'reading');
      document.getElementById('nav-bookmarks').classList.toggle('active', view === 'bookmarks');
    }

    // Dynamic Status Bar update
    function renderStatusBar(state) {
      const total = state.books.length;
      const showing = store.filteredBooks.length;
      const view = state.ui.currentView;
      const sort = state.preferences.sort;

      document.getElementById('status-count').textContent = `${total} Books`;
      document.getElementById('status-showing').textContent = `Showing ${showing}`;

      let filterText = "No active filter";
      if (view === 'reading') filterText = "Filter: Currently Reading";
      else if (view === 'bookmarks') filterText = "Filter: Bookmarked";
      else if (view === 'category' && state.ui.activeCategory) filterText = `Filter: Category "${state.ui.activeCategory}"`;
      if (state.ui.searchQuery) filterText += ` + Search "${state.ui.searchQuery}"`;

      document.getElementById('status-filter').textContent = filterText;

      const sortLabels = {
        title: 'Title',
        year: 'Year Published',
        lastOpened: 'Last Opened',
        progress: 'Reading Progress',
        author: 'Author',
        publisher: 'Publisher'
      };
      document.getElementById('status-sort').textContent = `Sort: ${sortLabels[sort] || sort}`;
    }

    // Main workspace renderer
    function renderWorkspace(state) {
      const workspace = document.getElementById('view-workspace');
      const view = state.ui.currentView;

      if (view === 'home') {
        renderHomeView(state, workspace);
      } else {
        renderGridView(state, workspace);
      }
    }

    // Home view layout
    function renderHomeView(state, workspace) {
      workspace.innerHTML = "";

      const homeViewDiv = document.createElement('div');
      homeViewDiv.className = 'home-view';

      // 1. Greeting
      const hr = new Date().getHours();
      let greetWord = "Good Morning";
      if (hr >= 12 && hr < 17) greetWord = "Good Afternoon";
      else if (hr >= 17) greetWord = "Good Evening";

      const totalCount = state.books.length;
      const greeting = document.createElement('div');
      greeting.className = 'greeting-section';
      greeting.innerHTML = `
        <h2 class="greeting-title">${greetWord}, Vicky</h2>
        <div class="greeting-subtitle">Your personal bookshelf has <strong>${totalCount} books</strong> ready for offline reading.</div>
      `;
      homeViewDiv.appendChild(greeting);

      // 2. Continue Reading shelf
      const continuing = store.recentlyOpened.filter(b => {
        const rs = state.readingStates.get(b.folder);
        return rs && rs.progress > 0 && rs.progress < 100;
      }).slice(0, 6);

      if (continuing.length > 0) {
        const contSection = document.createElement('div');
        contSection.className = 'home-section';
        contSection.innerHTML = `<h3 class="section-title">Continue Reading</h3>`;
        
        const shelf = document.createElement('div');
        shelf.className = 'shelf-container';

        const frag = document.createDocumentFragment();
        continuing.forEach(book => {
          const card = createBookCardElement(book, state);
          card.classList.add('shelf-card');
          frag.appendChild(card);
        });
        shelf.appendChild(frag);
        contSection.appendChild(shelf);
        homeViewDiv.appendChild(contSection);
      }

      // 3. Recently Published
      const published = store.recentlyPublished.slice(0, 6);
      if (published.length > 0) {
        const pubSection = document.createElement('div');
        pubSection.className = 'home-section';
        pubSection.innerHTML = `<h3 class="section-title">Recently Published</h3>`;

        const shelf = document.createElement('div');
        shelf.className = 'shelf-container';

        const frag = document.createDocumentFragment();
        published.forEach(book => {
          const card = createBookCardElement(book, state);
          card.classList.add('shelf-card');
          frag.appendChild(card);
        });
        shelf.appendChild(frag);
        pubSection.appendChild(shelf);
        homeViewDiv.appendChild(pubSection);
      }

      // 4. Quick Category Cloud
      const counts = store.categoryCounts;
      if (counts.length > 0) {
        const catSection = document.createElement('div');
        catSection.className = 'home-section';
        catSection.innerHTML = `<h3 class="section-title">Popular Subjects</h3>`;

        const cloud = document.createElement('div');
        cloud.style.display = 'flex';
        cloud.style.flexWrap = 'wrap';
        cloud.style.gap = '10px';

        counts.slice(0, 12).forEach(([cat, count]) => {
          const catChip = document.createElement('button');
          catChip.className = 'category-btn';
          catChip.style.width = 'auto';
          catChip.style.padding = '8px 16px';
          catChip.style.border = '1px solid var(--border-color)';
          catChip.style.borderRadius = '20px';
          catChip.innerHTML = `${cat} <span class="category-count" style="margin-left:6px">${count}</span>`;
          catChip.onclick = () => store.dispatch({ type: 'SET_VIEW', payload: { view: 'category', category: cat } });
          cloud.appendChild(catChip);
        });

        catSection.appendChild(cloud);
        homeViewDiv.appendChild(catSection);
      }

      workspace.appendChild(homeViewDiv);
    }

    // Grid View
    function renderGridView(state, workspace) {
      workspace.innerHTML = "";

      const books = store.visibleBooks;
      if (books.length === 0) {
        workspace.innerHTML = `
          <div class="empty-state">
            <h3>No matching books found</h3>
            <div>Clear search queries or filters to see all available books.</div>
          </div>
        `;
        return;
      }

      const grid = document.createElement('div');
      grid.id = 'books-grid-view';
      grid.className = 'books-grid';

      const fragment = document.createDocumentFragment();
      books.forEach((book, idx) => {
        const card = createBookCardElement(book, state, idx);
        fragment.appendChild(card);
      });
      grid.appendChild(fragment);
      workspace.appendChild(grid);

      // Append loader if there are more
      if (state.ui.pagination.hasMore) {
        const loader = document.createElement('div');
        loader.id = 'pagination-trigger';
        loader.className = 'load-more-trigger';
        loader.innerHTML = `<div class="spinner"></div> Loading bookshelf items...`;
        workspace.appendChild(loader);
        setupObserver();
      }
    }

    // Card Builder
    function createBookCardElement(book, state, index = null) {
      const card = document.createElement('div');
      card.className = `book-card ${state.ui.drawer.selectedFolder === book.folder ? 'selected' : ''}`;
      card.setAttribute('tabindex', '0');
      card.setAttribute('data-folder', book.folder);

      // Bookmark indicator SVG
      const progressState = state.readingStates.get(book.folder);
      if (progressState && progressState.bookmarked) {
        const indicator = document.createElement('div');
        indicator.className = 'bookmark-indicator';
        indicator.innerHTML = `<svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>`;
        card.appendChild(indicator);
      }

      const coverContainer = document.createElement('div');
      coverContainer.className = 'cover-container';

      if (book.cover_url) {
        const img = document.createElement('img');
        img.className = 'cover-img';
        img.src = book.cover_url;
        img.alt = book.title;
        img.loading = 'lazy';
        img.setAttribute('decoding', 'async');
        img.onerror = () => {
          img.style.display = 'none';
          coverContainer.appendChild(createFallbackCover(book.title));
        };
        coverContainer.appendChild(img);
      } else {
        coverContainer.appendChild(createFallbackCover(book.title));
      }
      card.appendChild(coverContainer);

      const info = document.createElement('div');
      info.className = 'card-info';

      const title = document.createElement('div');
      title.className = 'card-title';
      title.title = book.title;
      title.textContent = book.title;
      info.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'card-meta';
      meta.textContent = book.author || 'Unknown Author';
      info.appendChild(meta);

      if (progressState && progressState.progress > 0) {
        const bar = document.createElement('div');
        bar.className = 'card-progress-bar';
        const fill = document.createElement('div');
        fill.className = 'card-progress-fill';
        fill.style.width = `${progressState.progress}%`;
        bar.appendChild(fill);
        info.appendChild(bar);
      }

      card.appendChild(info);

      card.onclick = (e) => {
        e.preventDefault();
        store.dispatch({ type: 'SELECT_BOOK', payload: { folder: book.folder, index } });
        store.dispatch({ type: 'SET_DRAWER', payload: { open: true, folder: book.folder } });
      };

      return card;
    }

    function createFallbackCover(titleText) {
      const fallback = document.createElement('div');
      fallback.className = 'cover-fallback';
      const t = document.createElement('div');
      t.className = 'cover-fallback-title';
      t.textContent = titleText;
      fallback.appendChild(t);
      const b = document.createElement('div');
      b.className = 'cover-fallback-badge';
      b.textContent = "O'Reilly Book";
      fallback.appendChild(b);
      return fallback;
    }

    // Observer setup for Load More pagination trigger
    let intersectionObserverInstance = null;
    function setupObserver() {
      if (intersectionObserverInstance) {
        intersectionObserverInstance.disconnect();
      }

      const trigger = document.getElementById('pagination-trigger');
      if (!trigger) return;

      intersectionObserverInstance = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && store.state.ui.pagination.hasMore && !store.state.ui.pagination.loading) {
          requestAnimationFrame(() => {
            store.dispatch({ type: 'LOAD_MORE', payload: { amount: 24 } });
          });
        }
      }, { root: document.getElementById('view-workspace'), threshold: 0.1 });

      intersectionObserverInstance.observe(trigger);
    }

    // Inspector Side Drawer details renderer
    function renderInspectorDrawer(state) {
      const drawer = document.getElementById('inspector-drawer');
      const { open, selectedFolder } = state.ui.drawer;

      if (!open || !selectedFolder) {
        drawer.classList.remove('open');
        drawer.innerHTML = "";
        return;
      }

      const book = state.books.find(b => b.folder === selectedFolder);
      if (!book) return;

      const progressState = state.readingStates.get(book.folder) || { progress: 0, bookmarked: false, completed: false, lastOpened: 0 };

      // Compute Related Books scoring
      const relatedCandidates = state.books.filter(b => b.folder !== book.folder).map(b => {
        let score = 0;
        (b.categories || []).forEach(cat => {
          if (book.categories.includes(cat)) score += 10;
        });
        if (b.author && book.author && b.author === book.author) score += 5;
        if (b.publisher && book.publisher && b.publisher === book.publisher) score += 3;

        return { book: b, score };
      });

      const related = relatedCandidates
        .filter(c => c.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 3)
        .map(c => c.book);

      drawer.innerHTML = `
        <div class="drawer-header">
          <div class="drawer-header-title">Inspector Details</div>
          <button class="drawer-close-btn" onclick="store.dispatch({ type: 'SET_DRAWER', payload: { open: false, folder: null } })">&times;</button>
        </div>
        <div class="drawer-content">
          <div class="drawer-book-hero">
            <div class="drawer-cover-wrapper">
              ${book.cover_url 
                ? `<img class="drawer-cover-img" src="${book.cover_url}" alt="${book.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`
                : ''
              }
              <div class="cover-fallback" style="${book.cover_url ? 'display:none;' : ''}">
                <div class="cover-fallback-title">${book.title}</div>
                <div class="cover-fallback-badge">O'Reilly</div>
              </div>
            </div>
            <div class="drawer-hero-meta">
              <div class="drawer-title" title="${book.title}">${book.title}</div>
              <div class="drawer-author">${book.author || 'Unknown Author'}</div>
              ${book.categories.length > 0 ? `<div class="drawer-badge">${book.categories[0]}</div>` : ''}
            </div>
          </div>

          <div class="drawer-section">
            <span class="drawer-section-title">Description</span>
            <div class="drawer-description">${book.description || 'No description available for this book.'}</div>
          </div>

          <div class="drawer-section">
            <span class="drawer-section-title">Categories & Tags</span>
            <div class="drawer-tags-editor">
              <div class="drawer-tags-list" id="drawer-tags-list"></div>
              <div class="drawer-tag-input-wrapper">
                <input type="text" id="add-tag-input" class="tag-input" placeholder="Add custom tag...">
                <button class="tag-add-btn" onclick="addCustomTag('${book.folder}')">+</button>
              </div>
            </div>
          </div>

          <div class="drawer-section">
            <span class="drawer-section-title">Book Metadata</span>
            <div class="drawer-metadata-grid">
              <div class="metadata-item">
                <span class="metadata-label">Publisher</span>
                <span class="metadata-value">${book.publisher || 'Unknown'}</span>
              </div>
              <div class="metadata-item">
                <span class="metadata-label">Published</span>
                <span class="metadata-value">${book.date || 'Unknown'}</span>
              </div>
              <div class="metadata-item">
                <span class="metadata-label">Year</span>
                <span class="metadata-value">${book.year || 'Unknown'}</span>
              </div>
              <div class="metadata-item">
                <span class="metadata-label">Folder ID</span>
                <span class="metadata-value" style="word-break: break-all; font-family: monospace; font-size: 0.72rem;">${book.folder}</span>
              </div>
            </div>
          </div>

          <div class="drawer-actions">
            <a href="/${book.folder}/book/index.html" target="_blank" class="drawer-primary-btn" onclick="store.dispatch({ type: 'UPDATE_PROGRESS', payload: { folder: '${book.folder}', progress: ${progressState.progress || 1} } })">Read Now</a>
            
            <div class="drawer-secondary-buttons">
              <button class="drawer-secondary-btn" onclick="store.dispatch({ type: 'TOGGLE_BOOKMARK', payload: { folder: '${book.folder}' } })">
                <svg width="14" height="14" fill="${progressState.bookmarked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:2px;"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                ${progressState.bookmarked ? 'Bookmarked' : 'Bookmark'}
              </button>
              <button class="drawer-secondary-btn" onclick="store.dispatch({ type: 'UPDATE_PROGRESS', payload: { folder: '${book.folder}', progress: ${progressState.progress === 100 ? 0 : 100} } })">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:2px;"><polyline points="20 6 9 17 4 12"></polyline></svg>
                ${progressState.progress === 100 ? 'Reset Progress' : 'Mark Completed'}
              </button>
            </div>

            <div class="drawer-progress-slider-container">
              <div class="progress-slider-header">
                <span>Reading Progress</span>
                <span id="slider-val">${progressState.progress}%</span>
              </div>
              <input type="range" class="progress-slider" min="0" max="100" value="${progressState.progress}" 
                oninput="document.getElementById('slider-val').textContent = this.value + '%'"
                onchange="store.dispatch({ type: 'UPDATE_PROGRESS', payload: { folder: '${book.folder}', progress: parseInt(this.value) } })"
              >
            </div>
          </div>

          ${related.length > 0 ? `
            <div class="drawer-section">
              <span class="drawer-section-title">Related Books</span>
              <div class="related-books-grid">
                ${related.map(r => `
                  <div class="related-item-card" onclick="store.dispatch({ type: 'SELECT_BOOK', payload: { folder: '${r.folder}', index: null } }); store.dispatch({ type: 'SET_DRAWER', payload: { open: true, folder: '${r.folder}' } });">
                    <div class="related-cover">
                      ${r.cover_url ? `<img class="related-cover-img" src="${r.cover_url}" alt="${r.title}">` : ''}
                    </div>
                    <div class="related-info">
                      <div class="related-title" title="${r.title}">${r.title}</div>
                      <div class="related-author">${r.author || 'Unknown'}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;

      // Render custom tags
      const tagsListEl = document.getElementById('drawer-tags-list');
      if (tagsListEl) {
        tagsListEl.innerHTML = book.categories.map(cat => `
          <span class="tag-chip">
            ${cat}
            <button class="tag-remove-btn" onclick="removeCustomTag('${book.folder}', '${cat}')">&times;</button>
          </span>
        `).join('');
      }

      // Tag input listener for Enter
      const tagInput = document.getElementById('add-tag-input');
      if (tagInput) {
        tagInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            addCustomTag(book.folder);
          }
        });
      }

      drawer.classList.add('open');
    }

    // Subscribe Views to Store Changes
    store.subscribe((state) => {
      renderSidebarNavigation(state);
      renderSidebarCategories(state);
      renderStatusBar(state);
      renderWorkspace(state);
      renderInspectorDrawer(state);

      // Handle Theme Class toggling
      document.documentElement.setAttribute('data-theme', state.preferences.theme);
      
      // Dynamic rendering of Theme SVG
      const toggleBtn = document.getElementById('theme-toggle');
      toggleBtn.innerHTML = state.preferences.theme === 'light' 
        ? `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`
        : `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.22" x2="5.64" y2="17.78"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
    });

    // --- 6. Keyboard Shortcuts ---
    window.addEventListener('keydown', (e) => {
      // Focus Search: '/' or 'Ctrl+K'
      if ((e.key === '/' && document.activeElement.id !== 'global-search' && document.activeElement.id !== 'add-tag-input') || (e.ctrlKey && e.key.toLowerCase() === 'k')) {
        e.preventDefault();
        const searchInput = document.getElementById('global-search');
        searchInput.focus();
        searchInput.select();
        return;
      }

      // Close Active drawer/modal: 'Esc'
      if (e.key === 'Escape') {
        e.preventDefault();
        toggleHelpModal(false);
        store.dispatch({ type: 'SET_DRAWER', payload: { open: false, folder: null } });
        return;
      }

      // Shortcut help: '?'
      if (e.key === '?' && document.activeElement.id !== 'global-search' && document.activeElement.id !== 'add-tag-input') {
        e.preventDefault();
        const modal = document.getElementById('help-modal');
        toggleHelpModal(!modal.classList.contains('open'));
        return;
      }

      // Space Preview: 'Space'
      if (e.key === ' ' && document.activeElement.id !== 'global-search' && document.activeElement.id !== 'add-tag-input') {
        e.preventDefault();
        const visible = store.visibleBooks;
        const currentIdx = store.state.ui.selectedIndex;
        if (currentIdx !== null && visible[currentIdx]) {
          const drawerOpen = store.state.ui.drawer.open;
          store.dispatch({ type: 'SET_DRAWER', payload: { open: !drawerOpen, folder: visible[currentIdx].folder } });
        }
        return;
      }

      // Enter to Read: 'Enter'
      if (e.key === 'Enter' && document.activeElement.id !== 'global-search' && document.activeElement.id !== 'add-tag-input') {
        const visible = store.visibleBooks;
        const currentIdx = store.state.ui.selectedIndex;
        if (currentIdx !== null && visible[currentIdx]) {
          e.preventDefault();
          const targetUrl = `/${visible[currentIdx].folder}/book/index.html`;
          store.dispatch({ type: 'UPDATE_PROGRESS', payload: { folder: visible[currentIdx].folder, progress: store.state.readingStates.get(visible[currentIdx].folder)?.progress || 1 } });
          window.open(targetUrl, '_blank');
        }
        return;
      }

      // Grid navigation keys: Arrows
      const gridViews = document.getElementById('books-grid-view');
      if (gridViews && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && document.activeElement.id !== 'global-search' && document.activeElement.id !== 'add-tag-input') {
        e.preventDefault();
        const visible = store.visibleBooks;
        if (visible.length === 0) return;

        let currentIdx = store.state.ui.selectedIndex;
        if (currentIdx === null) {
          currentIdx = 0;
        } else {
          // Grid layout column calculation dynamically
          const computedStyles = window.getComputedStyle(gridViews);
          const columnsCount = computedStyles.getPropertyValue('grid-template-columns').split(' ').length || 4;

          if (e.key === 'ArrowRight') {
            currentIdx = Math.min(currentIdx + 1, visible.length - 1);
          } else if (e.key === 'ArrowLeft') {
            currentIdx = Math.max(currentIdx - 1, 0);
          } else if (e.key === 'ArrowDown') {
            currentIdx = Math.min(currentIdx + columnsCount, visible.length - 1);
          } else if (e.key === 'ArrowUp') {
            currentIdx = Math.max(currentIdx - columnsCount, 0);
          }
        }

        store.dispatch({ type: 'SELECT_BOOK', payload: { folder: visible[currentIdx].folder, index: currentIdx } });
        
        // Highlight and focus visual elements
        const cardElements = document.querySelectorAll('#books-grid-view .book-card');
        if (cardElements[currentIdx]) {
          cardElements[currentIdx].focus();
        }
      }
    });

    // --- 7. Initialization & Fetch Data ---
    async function loadBooks() {
      // Create skeletons inside view-workspace while loading
      const workspace = document.getElementById('view-workspace');
      workspace.innerHTML = `
        <div class="books-grid">
          ${Array.from({ length: 12 }).map(() => `
            <div class="skeleton-card">
              <div class="skeleton-cover"></div>
              <div class="skeleton-text">
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      try {
        const [stateRes, booksRes] = await Promise.all([
          fetch('/api/library_state').catch(e => null),
          fetch('/api/books')
        ]);
        
        if (!booksRes || !booksRes.ok) throw new Error("Books fetch failed");

        let serverState = null;
        if (stateRes && stateRes.ok) {
          serverState = await stateRes.json();
        } else {
          const stored = localStorage.getItem('library-data-v1');
          if (stored) {
            serverState = JSON.parse(stored);
          }
        }

        const rawBooks = await booksRes.json();
        store.initialize(serverState, rawBooks);
      } catch (err) {
        console.error("Failed to load library data:", err);
        workspace.innerHTML = `
          <div class="greeting-section" style="text-align: center; border-color: var(--accent-color);">
            <h2 class="greeting-title" style="color: var(--accent-color);">Failed to load library</h2>
            <div class="greeting-subtitle">Make sure the serve_library.py server is running correctly.</div>
          </div>
        `;
      }
    }

    loadBooks();
  </script>
</body>
</html>
